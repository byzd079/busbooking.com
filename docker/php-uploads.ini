; Photo uploads for the bus gallery are validated up to 8 MB inside the app
; (see BusPostController / BusImageProcessor). PHP's stock ceilings are lower
; than that — upload_max_filesize defaults to 2 MB and post_max_size to 8 MB —
; so a typical 3-5 MB phone photo is silently discarded before Laravel ever
; sees it, which looks to the user like "the upload just doesn't work".
;
; Raise both to sit above the 8 MB app cap (with headroom so the app's own
; friendly "larger than 8 MB" message is what a user hits, not a truncated
; POST), and give GD enough memory to decode a large photo before it is
; resized down to a WebP thumbnail.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
