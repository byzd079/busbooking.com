services:
  - type: web
    name: busbooking
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: BusBooking
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Dhaka
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: db.vqlnsvniymspkkmsrktt.supabase.co
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        value: "N@rdvpn9268"
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: "lax"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: IS_LOCALHOST
        value: "false"
      - key: SSLCZ_TESTMODE
        value: "true"
      - key: SSLCZ_STORE_ID
        sync: false
      - key: SSLCZ_STORE_PASSWORD
        sync: false
      # --- Mail (fixlog B6) ---
      # Render's free tier BLOCKS outbound SMTP (ports 25/465/587), so the Gmail
      # SMTP setup that works locally CANNOT work here. An HTTP-API transport is
      # required. Every option needs one composer package (see fixlog B6).
      #
      # MAIL_MAILER is intentionally left unset -> config/mail.php defaults to
      # "log", so a password-reset email is written to the Render log stream
      # instead of throwing. Set it only once a provider is actually configured.
      - key: MAIL_MAILER
        sync: false
      # Must be an address the provider has VERIFIED, or sending is rejected.
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: JatraPoth
      # Option A - Brevo (MAIL_MAILER=brevo): only provider that verifies a
      # plain gmail.com sender (OTP), 300/day free, no domain needed.
      - key: BREVO_API_KEY
        sync: false
      # Option B - AWS SES (MAIL_MAILER=ses)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      # Option C - Postmark (MAIL_MAILER=postmark): needs a domain you own.
      - key: POSTMARK_TOKEN
        sync: false
