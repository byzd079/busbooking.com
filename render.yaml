databases:
  - name: busbooking-db
    plan: free
    databaseName: busbooking
    user: busbooking

services:
  - type: web
    name: busbooking
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: BusBooking
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Dhaka
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: busbooking-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: busbooking-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: busbooking-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: busbooking-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: busbooking-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: IS_LOCALHOST
        value: "false"
      - key: SSLCZ_TESTMODE
        value: "true"
      - key: SSLCZ_STORE_ID
        sync: false
      - key: SSLCZ_STORE_PASSWORD
        sync: false
